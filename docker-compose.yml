version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: escala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: escala_db
      POSTGRES_USER: escala_admin
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escala_admin -d escala_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - escala-network

  backend:
    build: ./backend
    container_name: escala-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: escala_db
      DB_USER: escala_admin
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret}
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost}
      MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-gestao@sactudo.com.br}
      MAILER_SENDER_NAME: ${MAILER_SENDER_NAME:-Gestão de Escala}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-sactudo.com.br}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-smtp.titan.email}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SSL: ${SMTP_SSL:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-login}
      SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
      SMTP_OPENSSL_VERIFY_MODE: ${SMTP_OPENSSL_VERIFY_MODE:-peer}
      MAILER_INBOUND_EMAIL_DOMAIN: ${MAILER_INBOUND_EMAIL_DOMAIN:-sactudo.com.br}
    ports:
      - "3000:3000"
    networks:
      - escala-network

  nginx:
    image: nginx:alpine
    container_name: escala-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/public:/usr/share/nginx/html
    networks:
      - escala-network

networks:
  escala-network:
    driver: bridge

volumes:
  pgdata:
